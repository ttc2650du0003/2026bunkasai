<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デザインスタイル診断</title>
    <style>
        body {
            background: #fdfdfd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }

        .card {
            overflow: hidden;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            width: min(90vw, 360px);
            text-align: center;
            border: 1px solid #eee;
        }

        .hidden {
            display: none !important;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 18px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #427ab5;
            color: white;
            width: 100%;
            font-size: 1.1rem;
        }

        .btn-yes {
            background: #ceedaf;
            color: #333;
        }

        .btn-no {
            background: #acd4eb;
            color: #333;
        }

        .btn-option {
            font-size: 1rem;
        }

        button:hover {
            transform: scale(1.02);
            filter: brightness(0.9);
        }

        /* Result screen */
        .result-label {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .result-title {
            color: #406aaf;
            font-size: 1.4rem;
            font-weight: bold;
            background: #e2edff;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 0 0 20px 0;
        }

        .result-image-wrap {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #f0f0f0;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Placeholder style when no image */
        .result-image-wrap .placeholder {
            color: #bbb;
            font-size: 0.85rem;
            padding: 20px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card">
        <!-- Start -->
        <div id="start-screen">
            <h1 style="font-size: 1.5rem; margin-bottom: 10px;">デザインスタイル診断</h1>
            <p style="color: #666; margin-bottom: 30px; font-size: 0.9rem;">あなたにぴったりのデザインを提案します。</p>
            <button class="btn-primary" onclick="initQuiz()">診断を始める</button>
        </div>

        <!-- Quiz -->
        <div id="quiz-screen" class="hidden">
            <h2 id="question-content" style="font-size: 1.2rem; line-height: 1.5;">質問内容</h2>
            <div class="btn-group">
                <button id="btn-yes" class="btn-option btn-yes" onclick="handleAnswer(true)"></button>
                <button id="btn-no" class="btn-option btn-no" onclick="handleAnswer(false)"></button>
            </div>
        </div>

        <!-- Result -->
        <div id="result-screen" class="hidden">
            <p class="result-label">診断結果</p>
            <h1 id="result-text" class="result-title"></h1>

            <div class="result-image-wrap">
                <img id="result-image" src="" alt="診断結果画像"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <div class="placeholder" style="display:none;">
                    ここに画像が表示されます。<br>
                    <code>resultImages</code> の<br>
                    パスを設定してください。
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-option" style="background: #eee;" onclick="location.reload()">最初からやり直す</button>
            </div>
        </div>
    </div>

    <script>
        // =============================================
        // 🖼️ 結果ごとの画像パスをここで設定してください
        // =============================================
        const resultImages = {
            "英字新聞風":  "img/news.png",    // ← 差し替えてください
            "文化祭チラシ": "img/festival.png",    // ← 差し替えてください
            "写真コラージュ": "img/collection.png",   // ← 差し替えてください
            "ゲームチラシ": "img/game.png",        // ← 差し替えてください
            "香水チラシ":  "img/perfume.png",       // ← 差し替えてください
            "メニュー表":  "img/menu.png"          // ← 差し替えてください
        };

        // =============================================
        // Quiz data
        // =============================================
        const quizData = {
            "start": {
                q: "どのような雰囲気が好きですか？",
                yes: { label: "賑やか", next: "trend" },
                no:  { label: "穏やか", next: "humanTouch" }
            },
            "trend": {
                q: "流行やSNS映えをチェックしますか？",
                yes: { label: "チェックする",    next: "colorDesign" },
                no:  { label: "チェックしない",  next: "focusOn" }
            },
            "humanTouch": {
                q: "人の温かみとデジタル、どちらが好き？",
                yes: { label: "人の温かみ",      next: "focusOn" },
                no:  { label: "デジタルで無機質", next: "gameWorld" }
            },
            "colorDesign": {
                q: "デザインする時の色の好みは？",
                yes: { label: "元気でカラフルな色",  next: "eventSide" },
                no:  { label: "落ち着いたシックな色", next: "mood" }
            },
            "eventSide": {
                q: "文化祭やイベントでは？",
                yes: { label: "運営側",    result: "文化祭チラシ" },
                no:  { label: "お客さん側", result: "メニュー表" }
            },
            "focusOn": {
                q: "一つの事にこだわりますか？",
                yes: { label: "こだわる",    next: "mood" },
                no:  { label: "こだわらない", next: "characterDesign" }
            },
            "mood": {
                q: "雰囲気や空気感は好き？",
                yes: { label: "エモいが好き", result: "写真コラージュ" },
                no:  { label: "エモいが嫌い", result: "香水チラシ" }
            },
            "gameWorld": {
                q: "ゲームの世界観は好き？",
                yes: { label: "好き", next: "characterDesign" },
                no:  { label: "嫌い", next: "designStyle" }
            },
            "characterDesign": {
                q: "キャラデザイン物が好き？",
                yes: { label: "好き", result: "ゲームチラシ" },
                no:  { label: "嫌い", result: "英字新聞風" }
            },
            "designStyle": {
                q: "デザインのスタイルは？",
                yes: { label: "シンプルで洗練",  next: "selfWork" },
                no:  { label: "がちゃがちゃ",    next: "designPreference" }
            },
            "selfWork": {
                q: "自分で作るなら",
                yes: { label: "綺麗さ・上品さ",   result: "香水チラシ" },
                no:  { label: "元気いっぱいポップ", result: "文化祭チラシ" }
            },
            "designPreference": {
                q: "デザインの好みは？",
                yes: { label: "シンプルで静か", result: "英字新聞風" },
                no:  { label: "派手で個性的",   result: "ゲームチラシ" }
            }
        };

        let currentNode = "start";

        function initQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            renderQuestion();
        }

        function handleAnswer(isYes) {
            const choice = isYes ? "yes" : "no";
            const nextStep = quizData[currentNode][choice];

            if (nextStep.result) {
                showResult(nextStep.result);
            } else {
                currentNode = nextStep.next;
                renderQuestion();
            }
        }

        function renderQuestion() {
            const data = quizData[currentNode];
            document.getElementById('question-content').innerText = data.q;
            document.getElementById('btn-yes').innerText = data.yes.label;
            document.getElementById('btn-no').innerText = data.no.label;
        }

        function showResult(title) {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-text').innerText = title;

            const imgEl = document.getElementById('result-image');
            const placeholder = imgEl.nextElementSibling;
            const src = resultImages[title];

            if (src) {
                imgEl.src = src;
                imgEl.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                placeholder.style.display = 'block';
            }
        }
    </script>
</body>
</html>
